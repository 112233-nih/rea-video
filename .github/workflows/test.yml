name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: install
        run: |
          python -m pip install -e ".[ocr,dev]"
          # rapidocr 带进来的 opencv-python 和 headless 抢 cv2 目录，只留 headless
          python -m pip uninstall -y opencv-python
          python -m pip install --force-reinstall --no-deps "opencv-python-headless>=4.8,<5"
      - run: python -m pytest -q
      - run: python scripts/validate_capabilities.py --matrix
