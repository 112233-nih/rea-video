  - id: film_shortdrama_recap
    path: eval/media/film/shortdrama_recap.mp4
    source: 抖音 秋刀鱼（短剧解说）aweme 7619686582341895311；真人竖屏短剧（剧组拍摄）的解说剪辑，29.97fps
